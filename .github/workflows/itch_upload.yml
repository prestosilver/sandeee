name: Itch upload
run-name: Upload an itch release build
on:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    name: Run tests 
    strategy:
      matrix:
        optimize: [fast, debug]
        steam: [off, on]
    steps:
      - uses: actions/checkout@v3
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          cache-key: itch
      - name: Run tests
        run: |
          zig build -Doptimize=${{ matrix.optimize }} -Dsteam=${{ matrix.steam }} test

      - name: Summary results
        if: always()
        run: |
          cat zig-out/test_output.md >> $GITHUB_STEP_SUMMARY
  itch-upload:
    runs-on: ubuntu-latest
    name: Itch Upload
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/steam_upload' 
    needs: [tests]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
          cache-key: itch
      - name: Install butler
        uses: remarkablegames/setup-butler@v2
      - name: Install mingw
        run: sudo apt-get install gcc-mingw-w64 binutils-mingw-w64-x86-64
        shell: bash
      - name: Upload game
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
        run: |
          zig build upload_itch_release
