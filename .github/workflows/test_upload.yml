name: Test and upload
run-name: Run tests for commit '${{ github.event.head_commit.message }}' on ${{ github.ref_name }} and upload to stores.
on: [push]
jobs:
  tests:
    runs-on: ${{ matrix.runner }}
    name: Run tests 
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
        optimize: [fast, debug]
        steam: [off, on]
    steps:
      - uses: actions/checkout@v3
      - name: Cache zig build
        uses: actions/cache@v4
        env:
          cache-name: cache-zig
        with:
          path: ${{github.workspace}}/.zig-cache
          key: zig-tests-${{ matrix.optimize }}-${{ matrix.steam }}-${{ runner.os }}-${{hashFiles('**/*.zig','content')}}
          restore-keys: |
            zig-tests-${{ matrix.optimize }}-${{ matrix.steam }}-${{ runner.os }}-
            zig-tests-${{ matrix.optimize }}-${{ matrix.steam }}-
            zig-tests-${{ matrix.optimize }}-
            zig-tests-
            zig-

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Copy steam dll
        run: |
          cp deps/dll/steam_api64.dll ./steam_api64.dll
      - name: Run tests
        run: |
          zig build -Doptimize=${{ matrix.optimize }} -Dsteam=${{ matrix.steam }} test
      - name: Upload Results artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-s${{ matrix.steam }}-o${{ matrix.optimize }}.md
          path: zig-out/test_output.md
          archive: false

  steam-upload:
    runs-on: ubuntu-latest
    name: Steam Upload
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/steam_upload' 
    needs: [tests]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Setup SteamCMD
        id: steamcmd
        uses: RageAgainstThePixel/setup-steamcmd@v1
      - name: Cache zig build
        uses: actions/cache@v4
        env:
          cache-name: cache-zig
        with:
          path: ${{github.workspace}}/.zig-cache
          key: zig-build-steam-${{ runner.os }}-${{hashFiles('**/*.zig','content')}}
          restore-keys: |
            zig-build-steam-${{ runner.os }}-
            zig-build-steam-
            zig-build-
            zig-
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Install mingw
        run: sudo apt-get install gcc-mingw-w64 binutils-mingw-w64-x86-64
        shell: bash
      - name: Build game
        run: |
          zig build steam
      - name: Upload to steam (release)
        uses: RageAgainstThePixel/upload-steam@v2
        with:
            username: preston3410
            password: ${{ secrets.STEAM_PASSWORD }}
            app_build: ${{github.workspace}}/zig-out/pub/steam/upload_4124360.vdf
      - name: Upload to steam (demo)
        uses: RageAgainstThePixel/upload-steam@v2
        with:
            username: preston3410
            password: ${{ secrets.STEAM_PASSWORD }}
            app_build: ${{github.workspace}}/zig-out/pub/steam/upload_4124370.vdf
  itch-upload:
    runs-on: ubuntu-latest
    name: Itch Upload
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/steam_upload' 
    needs: [tests]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Cache zig build
        uses: actions/cache@v4
        env:
          cache-name: cache-zig
        with:
          path: ${{github.workspace}}/.zig-cache
          key: zig-build-itch-${{ runner.os }}-${{hashFiles('**/*.zig','content')}}
          restore-keys: |
            zig-build-itch-${{ runner.os }}-
            zig-build-itch-
            zig-build-
            zig-
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Install butler
        uses: remarkablegames/setup-butler@v2
      - name: Install mingw
        run: sudo apt-get install gcc-mingw-w64 binutils-mingw-w64-x86-64
        shell: bash
      - name: Build game
        run: |
          zig build itch
      - name: Upload game
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
        run: |
          zig build upload_itch
  gen-changelog:
    runs-on: ubuntu-latest
    name: Generate changelog
    needs: [tests]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Cache zig build
        uses: actions/cache@v4
        env:
          cache-name: cache-zig
        with:
          path: ${{github.workspace}}/.zig-cache
          key: zig-build-changelog-${{ runner.os }}-${{hashFiles('**/*.zig','content')}}
          restore-keys: |
            zig-build-changelog-${{ runner.os }}-
            zig-build-changelog-
            zig-build-
            zig-

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Generate changelog
        run: |
          zig build changelog

      - name: Upload Results artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog.edf
          path: zig-out/changelog.edf
          archive: false

  upload_www:
    runs-on: ubuntu-latest
    name: Generate www
    needs: [tests]
    steps:
      - name: Find the latest release tag
        # Source: https://github.com/marketplace/actions/find-latest-tag
        uses: oprypin/find-latest-tag@v1
        id: latest_tag
        with:
          repository: ${{ github.repository }}
          releases-only: true  # Ensures it grabs an official GitHub release, ignoring draft tags

      - name: Checkout latest release
        # Source: https://github.com/actions/checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.latest_tag.outputs.tag }}
          fetch-depth: 0
      - name: Cache zig build
        uses: actions/cache@v4
        env:
          cache-name: cache-zig
        with:
          path: ${{github.workspace}}/.zig-cache
          key: zig-build-www-${{ runner.os }}-${{hashFiles('**/*.zig','content')}}
          restore-keys: |
            zig-build-www-${{ runner.os }}-
            zig-build-www-
            zig-build-
            zig-
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Generate release www
        run: |
          zig build www
          mkdir ../www
          cp -r zig-out/www/* ../www/
          rm -rf zig-out/www
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Generate test www
        run: |
          zig build www
          mkdir -p ../www/alpha
          cp -r zig-out/www/* ../www/alpha/
          cp ../www/alpha/changelog.edf ../www/changelog.edf
      - name: Upload to gh pages
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: ../www

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-latest
    needs: upload_www
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4