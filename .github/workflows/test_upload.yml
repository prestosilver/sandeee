name: Test and upload
run-name: Run tests for commit '${{ github.event.head_commit.message }}' on ${{ github.ref_name }} and upload to stores.
on: [push]
jobs:
  tests:
    runs-on: ubuntu-latest
    name: Run tests 
    strategy:
      matrix:
        optimize: [ReleaseFast, Debug]
        steam: [Off, On]
    steps:
      - uses: actions/checkout@v3
      - name: Cache zig build
        uses: actions/cache@v4
        env:
          cache-name: cache-zig
        with:
          path: |
            ${{github.workspace}}/.cache/zig
            ${{github.workspace}}/.zig-cache
            ${{github.workspace}}/zig-pkg
          key: zig-tests-dbg-${{ runner.os }}-${{hashFiles('**/*.zig','content')}}
          restore-keys: |
            zig-tests-${{ matrix.optimize }}-${{ runner.os }}-
            zig-tests-${{ matrix.optimize }}-
            zig-tests-
            zig-

      - name: Setup Zig
        uses: korandoru/setup-zig@v1
        with:
          zig-version: 0.16.0
      - name: Run tests
        run: |
          zig build -Doptimize=${{ matrix.optimize }} -Dsteam=${{ matrix.steam }} test

      - name: Summary results
        if: always()
        run: |
          cat zig-out/test_output.md >> $GITHUB_STEP_SUMMARY
  steam-upload:
    runs-on: ubuntu-latest
    name: Steam Upload
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/steam_upload' 
    needs: [tests]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Setup SteamCMD
        id: steamcmd
        uses: RageAgainstThePixel/setup-steamcmd@v1
      - name: Cache zig build
        uses: actions/cache@v4
        env:
          cache-name: cache-zig
        with:
          path: |
            ${{github.workspace}}/.cache/zig
            ${{github.workspace}}/.zig-cache
            ${{github.workspace}}/zig-pkg
          key: zig-build-steam-${{ runner.os }}-${{hashFiles('**/*.zig','content')}}
          restore-keys: |
            zig-build-steam-${{ runner.os }}-
            zig-build-steam-
            zig-build-
            zig-
      - name: Setup Zig
        uses: korandoru/setup-zig@v1
        with:
          zig-version: 0.16.0
      - name: Install mingw
        run: sudo apt-get install gcc-mingw-w64 binutils-mingw-w64-x86-64
        shell: bash
      - name: Build game
        run: |
          zig build steam
      - name: Upload to steam (release)
        uses: RageAgainstThePixel/upload-steam@v2
        with:
            username: preston3410
            password: ${{ secrets.STEAM_PASSWORD }}
            app_build: ${{github.workspace}}/zig-out/pub/steam/upload_4124360.vdf
      - name: Upload to steam (demo)
        uses: RageAgainstThePixel/upload-steam@v2
        with:
            username: preston3410
            password: ${{ secrets.STEAM_PASSWORD }}
            app_build: ${{github.workspace}}/zig-out/pub/steam/upload_4124370.vdf
  itch-upload:
    runs-on: ubuntu-latest
    name: Itch Upload
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/steam_upload' 
    needs: [tests]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Cache zig build
        uses: actions/cache@v4
        env:
          cache-name: cache-zig
        with:
          path: |
            ${{github.workspace}}/.cache/zig
            ${{github.workspace}}/.zig-cache
            ${{github.workspace}}/zig-pkg
          key: zig-build-itch-${{ runner.os }}-${{hashFiles('**/*.zig','content')}}
          restore-keys: |
            zig-build-itch-${{ runner.os }}-
            zig-build-itch-
            zig-build-
            zig-
      - name: Setup Zig
        uses: korandoru/setup-zig@v1
        with:
          zig-version: 0.16.0
      - name: Install butler
        uses: remarkablegames/setup-butler@v2
      - name: Install mingw
        run: sudo apt-get install gcc-mingw-w64 binutils-mingw-w64-x86-64
        shell: bash
      - name: Build game
        run: |
          zig build itch
      - name: Upload game
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
        run: |
          zig build upload_itch
  gen-changelog:
    runs-on: ubuntu-latest
    name: Generate changelog
    needs: [tests]
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Cache zig build
        uses: actions/cache@v4
        env:
          cache-name: cache-zig
        with:
          path: |
            ${{github.workspace}}/.cache/zig
            ${{github.workspace}}/.zig-cache
            ${{github.workspace}}/zig-pkg
          key: zig-build-changelog-${{ runner.os }}-${{hashFiles('**/*.zig','content')}}
          restore-keys: |
            zig-build-changelog-${{ runner.os }}-
            zig-build-changelog-
            zig-build-
            zig-

      - name: Setup Zig
        uses: korandoru/setup-zig@v1
        with:
          zig-version: 0.16.0
      - name: Generate changelog
        run: |
          zig build changelog

      - name: Summary results
        run: |
          cat zig-out/changelog.edf >> $GITHUB_STEP_SUMMARY
