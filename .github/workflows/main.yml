name: Test 
run-name: Run zig tests for commit '${{ github.event.head_commit.message }}' on ${{ github.ref_name }}
on: [push]
jobs:
  tests-dbg:
    runs-on: ubuntu-latest
    name: Run tests 
    steps:
      - uses: actions/checkout@v3
      - name: Setup Zig
        uses: korandoru/setup-zig@v1
        with:
          zig-version: 0.15.2
      - name: Install glfw
        run: |
          sudo apt install libglfw3 libglfw3-dev
      - name: Run tests
        run: |
          zig build test
        id: md
      - name: Summary results
        if: always()
        run: |
          cat zig-out/test_output.md >> $GITHUB_STEP_SUMMARY
  tests-rel:
    runs-on: ubuntu-latest
    name: Run tests (release)
    steps:
      - uses: actions/checkout@v3
      - name: Setup Zig
        uses: korandoru/setup-zig@v1
        with:
          zig-version: 0.15.2
      - name: Install glfw
        run: |
          sudo apt install libglfw3 libglfw3-dev
      - name: Run tests
        run: |
          zig build test -Doptimize=ReleaseFast
        id: md
      - name: Summary results
        if: always()
        run: |
          cat zig-out/test_output.md >> $GITHUB_STEP_SUMMARY
  steam_upload:
    runs-on: ubuntu-latest
    name: Steam Upload
    if: github.ref == 'refs/heads/master' or github.ref == 'refs/heads/steam_upload' 
    needs: [tests-dbg tests-rel]
    steps:
      - name: Setup Zig
        uses: korandoru/setup-zig@v1
        with:
          zig-version: 0.15.2
      - name: Install glfw
        run: |
          sudo apt install libglfw3 libglfw3-dev
      - name: Uploads to steam
        with: # Set the secret as an input
          STEAM_PASSWORD: ${{ secrets.STEAM_PASSWORD }}
        run: |
          zig build upload_steam